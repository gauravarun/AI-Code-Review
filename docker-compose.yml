services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acr_user
      POSTGRES_PASSWORD: acr_password
      POSTGRES_DB: ai_code_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acr_user -d ai_code_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
